<svg width="100%" height="100%" viewBox="0 0 1600 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010f45"/>
      <stop offset="55%" stop-color="#052069"/>
      <stop offset="100%" stop-color="#123099"/>
    </linearGradient>

    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffba09" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffba09" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#ffba09" opacity="0.22"/>
    </pattern>

    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffba09"/>
      <stop offset="100%" stop-color="#e0a400"/>
    </linearGradient>

    <style>
      <![CDATA[
        .bg { }
        .grid { animation: gridPulse 6s ease-in-out infinite; }
        @keyframes gridPulse {
          0%, 100% { opacity: 0.55; }
          50%      { opacity: 1; }
        }

        .glow { animation: glowPulse 4.2s ease-in-out infinite; transform-origin: 1180px 90px; }
        @keyframes glowPulse {
          0%, 100% { opacity: 0.5; transform: scale(1); }
          50%      { opacity: 0.95; transform: scale(1.12); }
        }

        .curve-path {
          stroke-dasharray: 1800;
          stroke-dashoffset: 1800;
          animation: drawCurve 3.2s cubic-bezier(.16,1,.3,1) forwards;
        }
        @keyframes drawCurve {
          to { stroke-dashoffset: 0; }
        }

        .curve-glow {
          stroke-dasharray: 1800;
          stroke-dashoffset: 1800;
          animation: drawCurve 3.2s cubic-bezier(.16,1,.3,1) forwards;
          filter: blur(4px);
          opacity: 0.5;
        }

        .particle {
          animation: particlePulse 1.6s ease-in-out infinite;
        }
        @keyframes particlePulse {
          0%, 100% { r: 6px; opacity: 1; }
          50%      { r: 8.5px; opacity: 0.65; }
        }

        .symbol {
          font-family: 'JetBrains Mono', 'Fira Code', monospace;
          fill: #fff8ec;
          opacity: 0;
          animation: floatSym 5.5s ease-in-out infinite;
        }
        @keyframes floatSym {
          0%   { opacity: 0; transform: translateY(10px); }
          15%  { opacity: 0.5; }
          50%  { opacity: 0.85; transform: translateY(-8px); }
          85%  { opacity: 0.5; }
          100% { opacity: 0; transform: translateY(-16px); }
        }
        .s1 { animation-delay: 0s; }
        .s2 { animation-delay: 0.9s; }
        .s3 { animation-delay: 1.8s; }
        .s4 { animation-delay: 2.7s; }
        .s5 { animation-delay: 3.6s; }
        .s6 { animation-delay: 4.5s; }

        .tag-chip {
          opacity: 0;
          animation: fadeSlide 0.6s ease-out 0.2s forwards;
        }
        .title-line {
          opacity: 0;
          animation: fadeSlide 0.75s cubic-bezier(.16,1,.3,1) forwards;
        }
        .title-1 { animation-delay: 0.55s; }
        .title-2 { animation-delay: 0.75s; }
        .subtitle { animation-delay: 1.15s; }
        @keyframes fadeSlide {
          from { opacity: 0; transform: translateY(14px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        .status-dot {
          animation: dotBeat 2.2s ease-in-out infinite;
        }
        @keyframes dotBeat {
          0%, 100% { opacity: 1; }
          50%      { opacity: 0.35; }
        }

        .accent-line {
          stroke-dasharray: 1600;
          stroke-dashoffset: 1600;
          animation: drawLine 1.6s ease-out 0.1s forwards;
        }
        @keyframes drawLine {
          to { stroke-dashoffset: 0; }
        }
      ]]>
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1600" height="320" fill="url(#bgGrad)"/>
  <rect class="grid" width="1600" height="320" fill="url(#dotGrid)"/>
  <circle class="glow" cx="1180" cy="90" r="170" fill="url(#glowGrad)"/>

  <!-- Top accent line (neubrutalist hard border echo) -->
  <line class="accent-line" x1="0" y1="6" x2="1600" y2="6" stroke="#ffba09" stroke-width="4"/>

  <!-- Floating math symbols -->
  <text class="symbol s1" x="120"  y="60"  font-size="26">&#8721;</text>
  <text class="symbol s2" x="960"  y="48"  font-size="22">&#8747;</text>
  <text class="symbol s3" x="1340" y="230" font-size="24">&#960;</text>
  <text class="symbol s4" x="70"   y="250" font-size="20">R&#8320;</text>
  <text class="symbol s5" x="1220" y="270" font-size="20">&#948;</text>
  <text class="symbol s6" x="1440" y="70"  font-size="22">&#8734;</text>

  <!-- SIR-UV style epidemic curve, right-side visual motif -->
  <path id="epiPath" class="curve-glow"
        d="M 950,220 C 1030,220 1060,90 1140,90 C 1210,90 1230,190 1300,190 C 1360,190 1380,120 1450,120"
        fill="none" stroke="url(#curveGrad)" stroke-width="10" stroke-linecap="round"/>
  <path class="curve-path"
        d="M 950,220 C 1030,220 1060,90 1140,90 C 1210,90 1230,190 1300,190 C 1360,190 1380,120 1450,120"
        fill="none" stroke="url(#curveGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <circle class="particle" r="6" fill="#fff8ec" stroke="#010f45" stroke-width="2">
    <animateMotion dur="3.2s" repeatCount="indefinite"
      path="M 950,220 C 1030,220 1060,90 1140,90 C 1210,90 1230,190 1300,190 C 1360,190 1380,120 1450,120"/>
  </circle>

  <!-- Status chip -->
  <g class="tag-chip" transform="translate(80,58)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffba09" stroke="#010f45" stroke-width="2"/>
    <circle class="status-dot" cx="20" cy="17" r="5" fill="#010f45"/>
    <text x="34" y="22" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#010f45" letter-spacing="0.5">OPEN TO WORK · DATA ANALYST</text>
  </g>

  <!-- Main title -->
  <text class="title-line title-1" x="80" y="150"
        font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="52" font-weight="700" fill="#fff8ec">
    Dimas Damar Nusantoro
  </text>
  <text class="title-line title-2" x="80" y="196"
        font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="30" font-weight="700" fill="#ffba09">
    S.Si.
  </text>

  <!-- Subtitle -->
  <text class="title-line subtitle" x="80" y="238"
        font-family="'JetBrains Mono',monospace" font-size="15.5" fill="#c3cdf2" letter-spacing="0.3">
    Mathematics Graduate &#183; Data Analyst &#183; Epidemiological-ML Modeling
  </text>

  <!-- Bottom accent line -->
  <line class="accent-line" x1="0" y1="314" x2="1600" y2="314" stroke="#ffba09" stroke-width="4"/>
</svg>
