name: Generate Snake Contribution Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: dimasdn29
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ffba09&color_dots=%23010f45,%23052069,%23123099,%2300539c,%23ffba09
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ffba09

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
