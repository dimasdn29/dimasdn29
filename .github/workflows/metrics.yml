name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"    # sekali sehari — cukup, jangan terlalu sering (batas rate-limit API GitHub)
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg

          # --- Sections yang ditampilkan (pengganti stats card + top-langs) ---
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          # --- Pengganti activity-graph (kalender kontribusi isometrik) ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- Tema gelap, mendekati palet navy/amber ---
          config_timezone: Asia/Jakarta
          theme: dark_dimmed
